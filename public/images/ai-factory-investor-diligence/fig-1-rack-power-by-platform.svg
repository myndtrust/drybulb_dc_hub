<text class="m" x="282" y="314" font-size="12">rack kW not published; 1 kW TDP per GPU, up to 64 GPUs per air rack</text>
<text class="m" x="24" y="390" font-size="11">Published per-rack power (maxima where stated); light segment = Max-Q to Max-P. Not like-for-like.</text>
