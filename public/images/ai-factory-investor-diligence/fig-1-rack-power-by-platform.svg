<line x1="693.1" y1="60" x2="693.1" y2="346" stroke="#e3dccb" stroke-width="1"/>
<text class="m" x="693.1" y="364" font-size="11.5" text-anchor="middle">200</text>
<line x1="798.8" y1="60" x2="798.8" y2="346" stroke="#e3dccb" stroke-width="1"/>
