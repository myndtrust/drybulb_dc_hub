<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 406" role="img" aria-label="Published maximum rack power by platform: AMD Helios 246 kW, NVIDIA Vera Rubin NVL72 188 to 227 kW, NVIDIA GB300 NVL72 142 kW, AMD MI355X OEM rack 120 kW, NVIDIA DGX B300 rack about 56 kW, AMD MI350X air rack not published">
<style>.t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#16130d}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#6e6450}</style>
<rect width="860" height="406" fill="#fbf8f0"/>
