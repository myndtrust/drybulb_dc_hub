<rect x="270" y="116" width="397.7" height="20" rx="4" fill="#00809c"/>
<rect x="669.7" y="116" width="80.5" height="20" rx="4" fill="#00809c" fill-opacity="0.45"/>
<text class="t" x="758.2" y="130" font-size="12">188–227 kW</text>
<text class="t" x="258" y="176" font-size="12.5" text-anchor="end">NVIDIA GB300 NVL72</text>
<rect x="270" y="162" width="300.4" height="20" rx="4" fill="#00809c"/>
<text class="t" x="578.4" y="176" font-size="12">up to 142 kW</text>
