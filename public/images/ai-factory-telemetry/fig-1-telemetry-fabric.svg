<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="The AI-factory telemetry fabric: OT and IT sources publish to an event bus consumed by digital twin, control, analytics and agents">
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#16130d}
    .lbl{font-size:12px} .sm{font-size:10px;fill:#6e6450}
    .hd{font-family:Georgia,serif;font-size:14px;font-weight:600}
    .ot{fill:#ebe4d3;stroke:#cfc4ab} .it{fill:#dfeaec;stroke:#9bbcc1}
    .bus{fill:#f6dccf;stroke:#d4471d} .con{fill:#e7eee2;stroke:#9bb39a}
    .arr{stroke:#16130d;stroke-width:1.4;marker-end:url(#ah)}
    .arrhot{stroke:#d4471d;stroke-width:2;marker-end:url(#ahh)}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16130d"/></marker>
    <marker id="ahh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d4471d"/></marker>
  </defs>
  <rect width="860" height="470" fill="#fbf8f0"/>

  <text class="t hd" x="20" y="26">Operational + IT sources</text>
  <text class="t hd" x="372" y="26" fill="#d4471d">Event bus</text>
  <text class="t hd" x="700" y="26">Consumers</text>

  <text class="t sm" x="20" y="52" fill="#6e6450">OT — plant</text>
  <rect class="ot" x="20" y="60" width="190" height="40" rx="3"/><text class="t lbl" x="115" y="84" text-anchor="middle">Grid intake / EPMS</text>
  <rect class="ot" x="20" y="108" width="190" height="40" rx="3"/><text class="t lbl" x="115" y="132" text-anchor="middle">BMS · cooling / CDU</text>
  <rect class="ot" x="20" y="156" width="190" height="40" rx="3"/><text class="t lbl" x="115" y="180" text-anchor="middle">BESS · switchgear</text>

  <text class="t sm" x="20" y="232" fill="#6e6450">IT — compute</text>
  <rect class="it" x="20" y="240" width="190" height="40" rx="3"/><text class="t lbl" x="115" y="264" text-anchor="middle">BMC / Redfish</text>
  <rect class="it" x="20" y="288" width="190" height="40" rx="3"/><text class="t lbl" x="115" y="312" text-anchor="middle">GPU / DPU telemetry</text>
  <rect class="it" x="20" y="336" width="190" height="40" rx="3"/><text class="t lbl" x="115" y="360" text-anchor="middle">Schedulers / orchestration</text>

  <rect class="bus" x="330" y="60" width="160" height="316" rx="4"/>
  <text class="t lbl" x="410" y="120" text-anchor="middle" font-weight="600">EVENT BUS</text>
  <text class="t sm" x="410" y="150" text-anchor="middle">pub / sub (MQTT)</text>
  <text class="t sm" x="410" y="170" text-anchor="middle">versioned contracts</text>
  <text class="t sm" x="410" y="190" text-anchor="middle">semantic payloads</text>
  <text class="t sm" x="410" y="210" text-anchor="middle">authz · mTLS / OAuth</text>
  <text class="t sm" x="410" y="230" text-anchor="middle">QoS tiers</text>
  <text class="t sm" x="410" y="250" text-anchor="middle">site federation</text>

  <rect class="con" x="640" y="60" width="200" height="40" rx="3"/><text class="t lbl" x="740" y="84" text-anchor="middle">Physics digital twin</text>
  <rect class="con" x="640" y="116" width="200" height="40" rx="3"/><text class="t lbl" x="740" y="140" text-anchor="middle">Closed-loop control</text>
  <rect class="con" x="640" y="172" width="200" height="40" rx="3"/><text class="t lbl" x="740" y="196" text-anchor="middle">Analytics / observability</text>
  <rect class="con" x="640" y="228" width="200" height="40" rx="3"/><text class="t lbl" x="740" y="252" text-anchor="middle">Autonomous agents</text>

  <line class="arr" x1="210" y1="80"  x2="330" y2="120"/>
  <line class="arr" x1="210" y1="128" x2="330" y2="150"/>
  <line class="arr" x1="210" y1="176" x2="330" y2="190"/>
  <line class="arr" x1="210" y1="260" x2="330" y2="240"/>
  <line class="arr" x1="210" y1="308" x2="330" y2="280"/>
  <line class="arr" x1="210" y1="356" x2="330" y2="320"/>
  <line class="arr" x1="490" y1="120" x2="640" y2="80"/>
  <line class="arr" x1="490" y1="150" x2="640" y2="136"/>
  <line class="arr" x1="490" y1="200" x2="640" y2="192"/>
  <line class="arrhot" x1="640" y1="248" x2="492" y2="300"/>
  <text class="t sm" x="556" y="300" fill="#d4471d">control ↩</text>

  <text class="t sm" x="20" y="420">Sources publish state on change; the bus routes/secures it; consumers subscribe — and agents/control publish commands back.</text>
  <text class="t sm" x="20" y="440" fill="#6e6450">Standardize the contracts and the security; stay agnostic about the payloads.</text>
</svg>
