<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-label="Comparison of legacy AC power chain versus 800VDC power chain">
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#16130d}
    .lbl{font-size:11px}
    .sm{font-size:10px;fill:#6e6450}
    .hd{font-family:Georgia,serif;font-size:16px;font-weight:600}
    .box-a{fill:#ebe4d3;stroke:#cfc4ab}
    .box-dc{fill:#dfeaec;stroke:#9bbcc1}
    .box-loss{fill:#f6dccf;stroke:#d4471d}
    .arr{stroke:#16130d;stroke-width:1.6;marker-end:url(#ah)}
    .arrhot{stroke:#d4471d;stroke-width:2.4;marker-end:url(#ahh)}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16130d"/></marker>
    <marker id="ahh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d4471d"/></marker>
  </defs>

  <!-- ============ PANEL A: LEGACY AC ============ -->
  <text x="24" y="30" class="t hd">A - Legacy AC architecture - many conversions</text>

  <!-- Row 1: facility-side (Grid through UPS) -->
  <g transform="translate(24,46)">
    <rect class="box-a" x="0" y="0" width="76" height="48" rx="3"/>
    <text class="t lbl" x="38" y="20" text-anchor="middle">Grid</text>
    <text class="t sm" x="38" y="36" text-anchor="middle">13.8 kV AC</text>

    <line class="arr" x1="76" y1="24" x2="102" y2="24"/>
    <rect class="box-a" x="102" y="0" width="94" height="48" rx="3"/>
    <text class="t lbl" x="149" y="14" text-anchor="middle">Transformer</text>
    <text class="t sm" x="149" y="28" text-anchor="middle">up to 5000 kVA</text>
    <text class="t sm" x="149" y="42" text-anchor="middle">-&gt; 480 V AC</text>

    <line class="arr" x1="196" y1="24" x2="222" y2="24"/>
    <rect class="box-a" x="222" y="0" width="94" height="48" rx="3"/>
    <text class="t lbl" x="269" y="14" text-anchor="middle">Switchboard</text>
    <text class="t sm" x="269" y="28" text-anchor="middle">up to 6000 A</text>
    <text class="t sm" x="269" y="42" text-anchor="middle">480 V AC</text>

    <line class="arr" x1="316" y1="24" x2="342" y2="24"/>
    <rect class="box-loss" x="342" y="0" width="76" height="48" rx="3"/>
    <text class="t lbl" x="380" y="20" text-anchor="middle">UPS</text>
    <text class="t sm" x="380" y="36" text-anchor="middle">AC-DC-AC</text>

    <line class="arr" x1="418" y1="24" x2="444" y2="24"/>
    <rect class="box-loss" x="444" y="0" width="76" height="48" rx="3"/>
    <text class="t lbl" x="482" y="20" text-anchor="middle">PDU</text>
    <text class="t sm" x="482" y="36" text-anchor="middle">480-&gt;415 V</text>

    <line class="arr" x1="520" y1="24" x2="546" y2="24"/>
    <rect class="box-a" x="546" y="0" width="86" height="48" rx="3"/>
    <text class="t lbl" x="589" y="20" text-anchor="middle">RPP / Busway</text>
    <text class="t sm" x="589" y="36" text-anchor="middle">415 V AC</text>

    <line class="arr" x1="632" y1="24" x2="658" y2="24"/>
    <rect class="box-loss" x="658" y="0" width="80" height="48" rx="3"/>
    <text class="t lbl" x="698" y="14" text-anchor="middle">Rack PSU</text>
    <text class="t sm" x="698" y="28" text-anchor="middle">415 V AC in</text>
    <text class="t sm" x="698" y="42" text-anchor="middle">AC/DC-&gt;54 V</text>

    <line class="arr" x1="738" y1="24" x2="764" y2="24"/>
    <rect class="box-a" x="764" y="0" width="48" height="48" rx="3"/>
    <text class="t lbl" x="788" y="16" text-anchor="middle">VRM</text>
    <text class="t lbl" x="788" y="28" text-anchor="middle">-&gt; GPU</text>
    <text class="t sm" x="788" y="42" text-anchor="middle">&lt;1 V</text>
  </g>

  <text x="24" y="130" class="t sm">Red stages = conversion losses &amp; failure points. 6+ stages grid-to-chip. Up to 200 kg Cu busbar per 1 MW rack at 54 V.</text>
  <text x="24" y="146" class="t sm">End-to-end distribution efficiency ~93.6%. UPS double-conversion, PDU step-down, and rack PSU rectification each add loss.</text>

  <line x1="24" y1="166" x2="836" y2="166" stroke="#cfc4ab" stroke-dasharray="4 4"/>

  <!-- ============ PANEL B: 800 VDC (Heron reference) ============ -->
  <text x="24" y="200" class="t hd" fill="#d4471d">B - 800 VDC architecture (Heron reference) - two conversion stages</text>

  <g transform="translate(24,218)">
    <rect class="box-a" x="0" y="0" width="76" height="48" rx="3"/>
    <text class="t lbl" x="38" y="20" text-anchor="middle">Grid</text>
    <text class="t sm" x="38" y="36" text-anchor="middle">34.5 kV AC</text>

    <line class="arrhot" x1="76" y1="24" x2="112" y2="24"/>

    <!-- Heron Link SST: wider box with SuperBBU note -->
    <rect class="box-dc" x="112" y="0" width="180" height="48" rx="3"/>
    <text class="t lbl" x="202" y="16" text-anchor="middle">Heron Link SST</text>
    <text class="t sm" x="202" y="30" text-anchor="middle">MV AC -&gt; 800 V DC</text>
    <text class="t sm" x="202" y="42" text-anchor="middle">+ integrated SuperBBU</text>

    <!-- Long 800V DC distribution run — label above the arrow, two lines -->
    <line class="arrhot" x1="292" y1="24" x2="460" y2="24"/>
    <text class="t sm" x="376" y="-2" text-anchor="middle" fill="#d4471d">800 VDC distribution</text>
    <text class="t sm" x="376" y="10" text-anchor="middle" fill="#d4471d">single cable per shelf</text>

    <!-- SSCB / Rack input -->
    <rect class="box-dc" x="460" y="0" width="120" height="48" rx="3"/>
    <text class="t lbl" x="520" y="16" text-anchor="middle">SSCB + rack input</text>
    <text class="t sm" x="520" y="30" text-anchor="middle">800 V DC protected</text>
    <text class="t sm" x="520" y="42" text-anchor="middle">&lt;5 us fault clear</text>

    <line class="arr" x1="580" y1="24" x2="616" y2="24"/>
    <rect class="box-a" x="616" y="0" width="100" height="48" rx="3"/>
    <text class="t lbl" x="666" y="20" text-anchor="middle">Rack DC/DC</text>
    <text class="t sm" x="666" y="36" text-anchor="middle">800 V -&gt; 6 V</text>

    <line class="arr" x1="716" y1="24" x2="752" y2="24"/>
    <rect class="box-a" x="752" y="0" width="60" height="48" rx="3"/>
    <text class="t lbl" x="782" y="16" text-anchor="middle">VRM</text>
    <text class="t lbl" x="782" y="28" text-anchor="middle">-&gt; GPU</text>
    <text class="t sm" x="782" y="42" text-anchor="middle">&lt;1 V</text>
  </g>

  <text x="24" y="306" class="t sm">2 conversion stages (SST + rack DC/DC). No transformer, switchboard, UPS, or PDU. Electrical room eliminated.</text>
  <text x="24" y="322" class="t sm">End-to-end distribution efficiency ~97%. ~45% less copper, ~65% lower electrical cost per MW.</text>

  <!-- ============ LOSS COMPARISON BARS ============ -->
  <g transform="translate(24,356)">
    <text class="t lbl" x="0" y="0">Relative power loss in the distribution chain (illustrative)</text>
    <rect x="0" y="14" width="520" height="22" fill="#f6dccf" stroke="#d4471d"/>
    <text class="t sm" x="260" y="30" text-anchor="middle" fill="#16130d">~6.4% loss</text>
    <text class="t sm" x="530" y="30">Legacy 480 VAC</text>
    <rect x="0" y="44" width="250" height="22" fill="#dfeaec" stroke="#9bbcc1"/>
    <text class="t sm" x="125" y="60" text-anchor="middle" fill="#16130d">~3.0% loss</text>
    <text class="t sm" x="260" y="60">800 VDC (Heron)</text>
  </g>

  <!-- ============ STAGE COUNT COMPARISON ============ -->
  <g transform="translate(24,440)">
    <text class="t lbl" x="0" y="0">Conversion stages, grid to rack-level DC</text>
    <g transform="translate(0,14)">
      <rect x="0" y="0" width="24" height="16" fill="#f6dccf" stroke="#d4471d" rx="2"/>
      <rect x="28" y="0" width="24" height="16" fill="#f6dccf" stroke="#d4471d" rx="2"/>
      <rect x="56" y="0" width="24" height="16" fill="#f6dccf" stroke="#d4471d" rx="2"/>
      <rect x="84" y="0" width="24" height="16" fill="#f6dccf" stroke="#d4471d" rx="2"/>
      <text class="t sm" x="120" y="13">4 stages (xfmr, UPS, PDU step-down, PSU rectification)</text>
      <text class="t sm" x="530" y="13">Legacy 480 VAC</text>
    </g>
    <g transform="translate(0,38)">
      <rect x="0" y="0" width="24" height="16" fill="#dfeaec" stroke="#9bbcc1" rx="2"/>
      <text class="t sm" x="34" y="13">1 stage (SST only)</text>
      <text class="t sm" x="530" y="13">800 VDC (Heron)</text>
    </g>
  </g>

  <text x="24" y="520" class="t sm">Sources: Heron Power "A Blueprint for 800 VDC Datacenters" (2026). NVIDIA 800 VDC technical blog. The Register (contact-resistance physics).</text>
</svg>
