<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="Time allowed to restore 90 percent of pre-fault power after voltage recovers. Ireland 0.5 s adopted; ERCOT transfer schemes 0.5 s adopted; Australia draft automatic 0.5 s; Fingrid 1 s adopted; Australia draft minimum 1 s; AESO 1 s default up to 10 s, secondary; NERC draft 1 s strong to 10 s weak; ERCOT 2 s adopted; PJM proposed 2 s; CAISO proposed 3 s; ENTSO-E non-binding 0.5 to 5 s at 80 to 100 percent.">
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#16130d}
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#6e6450}
  </style>
  <rect width="860" height="460" fill="#fbf8f0"/>
  <text class="t" x="24" y="30" font-size="15" font-weight="600">Time allowed to restore ~90% of pre-fault power, seconds</text>
  <rect x="24" y="44" width="13" height="13" rx="2" fill="#3f6f3a"/><text class="t" x="43" y="55" font-size="11.5">Adopted / approved</text>
  <rect x="210" y="44" width="13" height="13" rx="2" fill="#e8902a"/><text class="t" x="229" y="55" font-size="11.5">Proposed / draft</text>
  <rect x="380" y="44" width="13" height="13" rx="2" fill="#9a8f78"/><text class="t" x="399" y="55" font-size="11.5">Non-binding or secondary-sourced</text>
  <g stroke="#e3dccb" stroke-width="1">
    <line x1="416" y1="70" x2="416" y2="388"/><line x1="512" y1="70" x2="512" y2="388"/>
    <line x1="608" y1="70" x2="608" y2="388"/><line x1="704" y1="70" x2="704" y2="388"/><line x1="800" y1="70" x2="800" y2="388"/>
  </g>
  <line x1="320" y1="70" x2="320" y2="388" stroke="#16130d" stroke-width="1.2"/>
  <g class="m" font-size="11" text-anchor="middle">
    <text x="320" y="404">0</text><text x="416" y="404">1</text><text x="512" y="404">2</text>
    <text x="608" y="404">3</text><text x="704" y="404">4</text><text x="800" y="404">5</text>
  </g>
  <g class="t" font-size="11.5" text-anchor="end">
    <text x="310" y="88">Ireland MPID345</text>
    <text x="310" y="116">ERCOT 282, transfer schemes</text>
    <text x="310" y="144">Australia ERC0394, automatic</text>
    <text x="310" y="172">Fingrid</text>
    <text x="310" y="200">Australia ERC0394, minimum</text>
    <text x="310" y="228">AESO (via CAISO survey)</text>
    <text x="310" y="256">NERC LLWG draft</text>
    <text x="310" y="284">ERCOT NOGRR 282</text>
    <text x="310" y="312">PJM Att. D-2</text>
    <text x="310" y="340">CAISO straw</text>
    <text x="310" y="368">ENTSO-E Annex A (80–100%)</text>
  </g>
  <rect x="320" y="76" width="48" height="16" fill="#3f6f3a"/><text class="t" x="374" y="88" font-size="11">0.5</text>
  <rect x="320" y="104" width="48" height="16" fill="#3f6f3a"/><text class="t" x="374" y="116" font-size="11">0.5</text>
  <rect x="320" y="132" width="48" height="16" fill="#e8902a"/><text class="t" x="374" y="144" font-size="11">0.5</text>
  <rect x="320" y="160" width="96" height="16" fill="#3f6f3a"/><text class="t" x="422" y="172" font-size="11">1</text>
  <rect x="320" y="188" width="96" height="16" fill="#e8902a"/><text class="t" x="422" y="200" font-size="11">1</text>
  <rect x="320" y="216" width="96" height="16" fill="#9a8f78"/>
  <line x1="416" y1="224" x2="796" y2="224" stroke="#9a8f78" stroke-width="2" stroke-dasharray="4 3"/><path d="M796,219 l8,5 l-8,5 z" fill="#9a8f78"/>
  <text class="t" x="430" y="220" font-size="10.5">1 default, adjustable to 10 →</text>
  <rect x="416" y="244" width="384" height="16" fill="#e8902a" opacity="0.45"/>
  <rect x="416" y="244" width="4" height="16" fill="#e8902a"/><path d="M796,247 l8,5 l-8,5 z" fill="#e8902a"/>
  <text class="t" x="430" y="256" font-size="10.5">1 (strong systems) to 10 (weak) →</text>
  <rect x="320" y="272" width="192" height="16" fill="#3f6f3a"/><text class="t" x="518" y="284" font-size="11">2</text>
  <rect x="320" y="300" width="192" height="16" fill="#e8902a"/><text class="t" x="518" y="312" font-size="11">2</text>
  <rect x="320" y="328" width="288" height="16" fill="#e8902a"/><text class="t" x="614" y="340" font-size="11">3</text>
  <rect x="368" y="356" width="432" height="16" fill="#9a8f78" opacity="0.5"/>
  <rect x="368" y="356" width="4" height="16" fill="#9a8f78"/><rect x="796" y="356" width="4" height="16" fill="#9a8f78"/>
  <text class="t" x="380" y="368" font-size="10.5">TSO chooses 0.5–5</text>
  <text class="m" x="24" y="428" font-size="10.5">Clock starts when voltage recovers to ~0.9 pu. Ireland approved Sep 22, 2026. Australia also bounds recovery at 110%.</text>
  <text class="m" x="24" y="444" font-size="10.5">NERC's draft lists Fingrid at 0.5 s; Fingrid's published requirement says 1 s, shown here.</text>
</svg>
